name: CI (Lint + Apps Script Deploy)

on:
  push:
    branches: ["main", "master"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # Deploy only on direct pushes to main/master (not on PRs)
      - name: Configure clasp credentials
        if: github.event_name == 'push'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing secret: CLASPRC_JSON"
            exit 1
          fi
          mkdir -p ~/.config
          echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Configure Script ID
        if: github.event_name == 'push'
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$SCRIPT_ID" ]; then
            echo "Missing secret: SCRIPT_ID"
            exit 1
          fi
          printf '{\n  "scriptId": "%s",\n  "rootDir": "."\n}\n' "$SCRIPT_ID" > .clasp.json

      - name: Push to Apps Script
        if: github.event_name == 'push'
        run: npx clasp push --force

      - name: Create deployment
        if: github.event_name == 'push'
        run: npx clasp deploy --description "GitHub Actions run $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
